name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (apk.zip)
        run: |
          test -f apk.zip || { echo "apk.zip پیدا نشد؛ آن را در ریشهٔ ریپو آپلود کن"; exit 1; }
          rm -rf android-app
          unzip -q apk.zip -d android-app
          ls -la android-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzadChat-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
